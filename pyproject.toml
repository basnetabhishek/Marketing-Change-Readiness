[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-change-readiness"
version = "0.1.0"
description = "Deterministic evaluation core for finding marketing assets affected by product changes"
requires-python = ">=3.10"

[project.scripts]
marketing-readiness-eval = "marketing_change_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

